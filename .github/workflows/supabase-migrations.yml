name: Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Verify secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "Missing SUPABASE_DB_PASSWORD"; exit 1; fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then echo "Missing SUPABASE_PROJECT_REF"; exit 1; fi

      - name: Link project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
